# Own project name and ports: a sibling checkout (../booktheinfluencer) already uses 5440/6390.
name: talent-booking-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: talent
      POSTGRES_DB: talent_dev
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent -d talent_dev"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6392:6379"

volumes:
  pgdata:
